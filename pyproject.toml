[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "wsi-graph-formers"
version = "0.1.0"
description = "Context-aware skin cancer epithelial cell classification with scalable graph transformers"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE.md" }
authors = [
    { name = "Lucas Sancere" },
    { name = "Noemie Moreau" },
    { name = "Katarzyna Bozek" },
]

# Runtime dependencies are deliberately left empty.
#
# They are pinned in `environment.yaml`, which is the only supported way to
# install them: torch 1.9.0+cu111 / torch-scatter / torch-sparse are served from
# the PyTorch and PyG wheel indexes, not from PyPI, so listing them here would
# make `pip install -e .` try to re-resolve (and break) an already working conda
# environment. Create the environment first, then run `pip install -e .`.
dependencies = []


[project.urls]
Repository = "https://github.com/lucas-sancere/wsi-graph-formers"
Paper = "https://arxiv.org/abs/2602.15783"
Dataset = "https://doi.org/10.5281/zenodo.21415205"


# Packaging
[tool.setuptools]
package-dir = { "" = "." }
packages = [
    "models",
    "utils",
    "dataset_tools",
    "configs",
    "configs.Graph_Transformers",
    "baseline_tools",
    "baseline_tools.cellvit",
    "baseline_tools.hovernet",
]

# Ship the Hydra configs and the split-order files alongside the code, so that a
# non-editable install (`pip install .`) is usable too.
[tool.setuptools.package-data]
"configs" = ["*.yaml", "orders/*.txt"]
"configs.Graph_Transformers" = ["*.yaml", "experiments/*.yaml"]
"baseline_tools.cellvit" = ["*.yaml"]


# Development tooling
[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=7",
    "pyyaml>=5",
    "tomli>=1.1; python_version < '3.11'",
]


[tool.ruff]
target-version = "py38"
line-length = 90  # keep: E501 is off, but I001 still wraps imports at this width
# Scoped to the code this repository authored. models/ is adapted from SGFormer
# and restyling it would only make the diff against upstream harder to read.
include = ["tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length
    "W291",   # trailing whitespace: almost all of it sits inside docstrings,
    "W293",   # where removing it would rewrite the string content itself
    "B905",   # zip() without strict=: needs per-call-site review, deferred
    "B007",   # unused loop control variable: cosmetic
    "F403",   # `from models.gnns import *`: how parse.py is meant to work,
    "F405",   # unrolling it is a refactor, not a lint fix
    "E402",   # import after code: deliberate sys.path setup in several scripts
]

[tool.ruff.lint.isort]
# `conftest` and the project packages are local, not third-party.
known-first-party = [
    "conftest", "models", "utils", "dataset_tools", "configs", "baseline_tools",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "torch: needs the full torch / PyG environment from environment.yaml",
]
