### graphs

# generate graph (pickle format)
pickle_output_corename: "graph_r50_mo"
radius: 50
timing: True
with_texture: False

# graph simplification
max_hops: 3
 
# graph splitting
split_from_simplified: False  
nbr_subgraphs: 100 

# graph visualization
graphtype: dataset  #[dataset, binary, infer]
backend: pyg  # [nx, pyg]
max_nodes_display: 300000
figsize: [10, 10]



### baseline training dataset 

# wsijson_to_trainset.py 
json_input_folder: "/data/lsancere/Data_General/TrainingSets/GraphSet/TumSeg_OriginalRes/\
previous_steps/hvn_output_fullwsi/"
output_baselineset: /data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/v1/
tmp_dir: /data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/v1/tempcache/
tile_size: 256
no_bbox: False 
generate_npz: False 
generate_png: True
png_level: 0 
png_overwrite: False

# concat pannuke6cformat and binaryformat 
concat:
  tiles_dir: "/data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/\
  4434-18/4434-18" 
  out_root: "/data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/\
  4434-18/folds_6clsformat"   
  folds: 3
  seed: 1337
  mask_key: type_map
  fold_index_starts_at_one: False
  num_classes: 6
  export_onehot_for_cellvit: True 
  # for 6 classes format 
  stratify: False
  pannuke: True
  class_map: [1,2,3,4,5,6]
  # for binary format
  channel_map: {1: 4, 2: 5}
  ratio_threshold: 0.9  
  stratify_by_major: True 



baselinedata_dir: "/data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/\
4434-18/CellViT_4434-18"


