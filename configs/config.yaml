### graphs

# generate graph (pickle format)
pickle_output_corename: "graph_r50_mote"
radius: 50
timing: True
with_texture: True  

# graph simplification
max_hops: 10
 
# graph splitting
split_from_simplified: True   
nbr_subgraphs: 100 

# graph visualization
graphtype: dataset  #[dataset, binary, infer]
backend: pyg  # [nx, pyg]
max_nodes_display: 800000
figsize: [10, 10]



### baseline training dataset 


baselinedata_dir: "/data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/\
4434-18/CellViT_binaryformat_nothreshold"

# wsijson_to_trainset.py 
json_input_folder: /data/lsancere/Data_General/TrainingSets/GraphSet/wsipatches/pairs/all/json/
output_baselineset: /data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/wsipatches/
tmp_dir: /data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/v1/tempcache/
tile_size: 256
no_bbox: False 
generate_npz: True 
generate_png: True
png_level: 0 
png_overwrite: False
tilejson: True

# concat pannuke6cformat and binaryformat 
concat:
  tiles_dir: "/data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/\
  wsipatches/folds/fold2" 
  out_root: "/data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/\
  wsipatches/folds_binaryformat_nt/fold2"   
  folds: 1
  seed: 1337
  mask_key: type_map
  fold_index_starts_at_one: False
  num_classes: 6
  export_onehot_for_cellvit: True 
  # for binary format
  channel_map: {1: 4, 2: 5}
  ratio_threshold: 0
  stratify_by_major: True
  # for 6 classes format 
  stratify: False
  pannuke: True
  class_map: [1,2,3,4,5,6]


# generate hovernet format 
hvn_format: 
  tiles_root: "/data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/\
  4434-18/4434-18"  
  hvn_format_output: "/data/lsancere/Data_General/TrainingSets/GraphSet/baseline_dataset/\
  4434-18/hovernet_binaryformat_nothreshold"
  folds: 1
  seed: 1337
  packed_dtype: int32
  # for binary format
  ratio_threshold: 0 
  stratify_by_major: True








