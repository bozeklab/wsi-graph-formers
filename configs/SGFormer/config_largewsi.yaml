# configfile.yaml
defaults:
  - _self_


# base configs
dataset: ""
sub_dataset: ""
data_dir: ../../../../../Data_General/TrainingSets/GraphSet/
model_dir: ../../../checkpoints/
device: 0                               # which gpu to use if any (default: 0)
cpu: False 
seed: 123
epochs: 500 
runs: 1                                # number of distinct runs
directed: False                        # set to not symmetrize adjacency
train_prop: 0.5                        # training label proportion
valid_prop: 0.25                       # validation label proportion 
protocol: semi                         # protocol for cora datasets, semi or supervised 
rand_split: False                      # use random splits    
rand_split_class: False                # use random splits with a fixed number of labeled nodes for each class
label_num_per_class: 20                # labeled nodes randomly selected
metric: acc                            # evaluation metric

# method 
method: sgformer

# model settings (general)
hidden_channels: 32 
num_layers: 2                          # number of layers for deep methods
num_heads: 1                           # number of heads for attention
alpha: 0.5                             # weight for residual link
use_bn : False                         # use layernorm
use_residual: False                    # use residual link for each GNN layer

# gnn branch (sgformer large)
gnn_use_bn: False                      # use batchnorm for each GNN layer
gnn_use_residual: False                # use residual link for each GNN layer
gnn_use_weight: False                  # use weight for GNN convolution
gnn_use_init: False                    # use initial feat for each GNN layer
gnn_use_act: False                     # use activation for each GNN layer
gnn_num_layers: 2                      # number of layers for GNN
gnn_dropout: 0.0
gnn_weight_decay: 0.001

# transformer branch (sgformer large)
trans_num_heads: 1                     # number of heads for attention
trans_use_weight: False                # use weight for trans convolution
trans_use_bn: False                    # use layernorm for trans
trans_use_residual: False              # use residual link for each trans layer
trans_use_act: False                   # use activation for each trans layer
trans_num_layers: 2                    # number of layers for all-pair attention
trans_dropout: 0.0  
trans_weight_decay: 0.001

# model setting sgformer specific
graph_weight: 0.8                      # graph weight  
aggregate: add                         # aggregate type, add or cat.
use_graph: True                        # use input graph   

# training
lr: 0.01
batch_size: 10000                      # mini batch training for large graphs
patience: 200                          # early stopping patience
weight_decay: 0.005
dropout: 0.5
save_model: False
use_pretrained: False

# display
display_step: 1                        # how often to print
eval_step: 1                           # how often to evaluate
cached: False                          # set to use faster sgc
print_prop: False                      # print proportions of predicted class
save_result: False
save_att: False                        # whether to save attention (for visualization)

# other
hops: 2                                # number of hops for SGC
gat_heads: 4                           # attention heads for gat
out_heads: 1                           # out heads for gat




### new parameters

# Random initialization 
fixed_init: True 

# training
trainingtask: nodeclassification       # [nodeclassification, binnodeclass_mask]  (binnodeclass_mask = Binary Node Classification with Known Context Nodes)

# dataloading
nodestype: allclasses                     # [allclasses, notumor], keep or remove classes labels of nodes after loading
customload: True                       # if True, can load extra parameters specific to skinwsi data

# inference
model_name: ""
pred_dir: ../../../predictions/
nbrclass_toinfer: 2 


