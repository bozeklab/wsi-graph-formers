# configfile.yaml
defaults:
  - _self_
  - experiments: tonameasarg          # possibility to add experiment config (see hydra docs)

## base configs
dataset: "" 
data_dir:         
sub_datasetname:                       # only for random node evaluation with one graph dataset: name of the graph.pt file
model_dir: checkpoints/
directed: False                        # set to not symmetrize adjacency
protocol: semi                         # protocol for cora datasets, semi or supervised 
rand_split: False                      # use random splits    
rand_split_class: False                # use random splits with a fixed number of labeled nodes for each class
label_num_per_class: 20                # labeled nodes randomly selected


## method 
method: sgformer


## training
device: 0                              # which gpu to use if any (default: 0)
cpu: False 
seed: 123
epochs: 500
fixed_init: True                       # wether or not to have a fixed initialization
runs: 1                                # number of distinct runs
train_prop: 0.80                       # training label proportion
valid_prop: 0.20                       # validation label proportion 
lr: 0.01
batch_size: 10000                      # mini batch training for large graphs
patience: 200                          # early stopping patience
weight_decay: 0.005
dropout: 0.5

trainingtask: binnodeclass_mask        # [nodeclassification, binnodeclass_mask]  (binnodeclass_mask = Binary Node Classification with Known Context Nodes)
trainsubgraphs_batch_size: 1
testsubgraphs_batch_size: 1
metric: bacc                           # evaluation metric
patient_csv: "patient_csv to provide"  # if we split according to patient information provide csv path
wsigraph: False                        # default: True. True if graphs are coming from full WSI image, False if graphs is coming from image patch (before splitting) 

zscore_normalization: False            # normalize with z-scoring the features and add weight for the class feature 
celltype_asfeature: True               # explanation to add 
gamma: 6.0                             # scaling factor applied to the one-hot encoding of cell_type

save_model: True 
save_train_eval: 
use_pretrained: False


## dataloading
nodestype: allclasses                  # [allclasses, notumor], keep or remove classes labels of nodes after loading
customload: True                       # if True, can load extra parameters specific to skinwsi data


## inference
multi_graph_infer: True
infer_onsimplified : False 
infer_graphtype: inferbinary           # [infer-multiclass, inferbinary]
model_name: ""
nbrclass_toinfer: 2
pred_input_dir: 
pred_input_name:                       # only for one graph infer
pred_output_dir: 
pred_output_name:                      # only for one graph infer 
evalinfer: True 


## cross-validation
cv: True                               # create split for cross validation
k_folds: 3                             # number of folds for cv
order_file: null                       # path to the file to reproduce paper splits 
# testfold: 0                          # id of the test fold

## model settings
# general
hidden_channels: 32 
num_layers: 2                          # number of layers for deep methods
num_heads: 1                           # number of heads for attention
alpha: 0.5                             # weight for residual link
use_bn : False                         # use layernorm
use_residual: False                    # use residual link for each GNN layer
use_act: False                         # use non-linearity for each layer

# other model settings
hops: 2                                # number of hops for SGC
gat_heads: 4                           # attention heads for gat
out_heads: 1                           # out heads for gat 


## SGFormer settings
# gnn branch (sgformer large)
gnn_use_bn: False                      # use batchnorm for each GNN layer
gnn_use_residual: False                # use residual link for each GNN layer
gnn_use_weight: False                  # use weight for GNN convolution
gnn_use_init: False                    # use initial feat for each GNN layer
gnn_use_act: False                     # use activation for each GNN layer
gnn_num_layers: 2                      # number of layers for GNN
gnn_dropout: 0.0
gnn_weight_decay: 0.001

# transformer branch (sgformer large)
trans_num_heads: 1                     # number of heads for attention
trans_use_weight: False                # use weight for trans convolution
trans_use_bn: False                    # use layernorm for trans
trans_use_residual: False              # use residual link for each trans layer
trans_use_act: False                   # use activation for each trans layer
trans_num_layers: 2                    # number of layers for all-pair attention
trans_dropout: 0.0  
trans_weight_decay: 0.001

# model setting sgformer specific
graph_weight: 0.8                      # graph weight  
aggregate: add                         # aggregate type, add or cat.
use_graph: True                        # use input graph   


## NodeFormer settings
lamda: 0.1                             # weight for edge reg loss
nb_random_features: 50                 # Random Features for Large-Scale Kernel Machines, see nodeformer paper method, here default value for large graphs
nb_gumbel_sample: 5                    # Gumbel softmax, see nodeformer paper method,  here default value for large graphs
rb_order: 1                            # order for relational bias, 0 for not use, here default value for large graph
rb_trans: identity                     # non-linearity for relational bias, here default value for large graph
use_jk: True                           # concat the layer-wise results in the final layer, here default value for large graph


## display
display_step: 1                        # how often to print
eval_step: 1                           # how often to evaluate
cached: False                          # set to use faster sgc
print_prop: False                      # print proportions of predicted class
save_result: False
save_att: False                        # whether to save attention (for visualization)



