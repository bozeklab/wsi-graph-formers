# @package _global_   
method: nodeformerbin 

### IMPORTANT for wsipatch dataset 
data_dir: toprovide_incmd
patient_csv: toprovide_incmd

trainingtask: binnodeclass_mask 
save_model: True 
metric: bacc 

## Node Features
zscore_normalization: True   
celltype_asfeature: True  

## Training setting
epochs: 200
eval_step: 10 
lr: 0.001
seed: 123
weight_decay: 0.005

## cross-validation
cv: True                                
k_folds: 3  

## NodeFormer settings
hidden_channels: 32 
num_layers: 2 
num_heads: 4   
lamda: 1.0          
nb_random_features: 30                
nb_gumbel_sample: 10       
rb_order: 2                            
rb_trans: sigmoid   
use_bn: True
use_residual: True
use_act: False 
use_jk: False 

## Device
device: 0
