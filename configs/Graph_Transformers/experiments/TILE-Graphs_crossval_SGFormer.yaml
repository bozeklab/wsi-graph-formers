# @package _global_   
dataset: subgraphs-skinwsi   # name of TILE-Graphs in the code
method: sgformerbin   

### IMPORTANT for wsipatch dataset 
data_dir: toprovide_incmd
patient_csv: toprovide_incmd

trainingtask: binnodeclass_mask 
save_model: True 
metric: bacc 

## Node Features
zscore_normalization: True   
celltype_asfeature: True  

## Training setting
epochs: 200 
eval_step: 10 
lr: 0.01 
seed: 123

## cross-validation
cv: True                                
k_folds: 3  
order_file: configs/orders/order_TILE-Graphs.txt

## SGFormer settings
hidden_channels: 64 
use_graph: True 
graph_weight: 0.8
gnn_num_layers: 4
gnn_dropout: 0.5 
gnn_weight_decay: 0.0005 
gnn_use_residual: False 
gnn_use_weight: False 
gnn_use_bn: False 
gnn_use_act: False 

trans_num_layers: 1 
trans_dropout: 0.2
trans_weight_decay: 0.001
trans_use_residual: True 
trans_use_weight: True 
trans_use_bn: True 
alpha: 0.5  

## Device
device: 0
 
