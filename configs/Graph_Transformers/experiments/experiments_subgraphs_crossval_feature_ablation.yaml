# @package _global_   
dataset: subgraphs-onegraphskinwsi    # name for WSI-Graphs-splits in the code 
method: sgformerbin

trainingtask: binnodeclass_mask 
save_model: True 
metric: bacc 

## Node Features
zscore_normalization: toprovide_incmd   
celltype_asfeature: toprovide_incmd  

## Training setting
epochs: 200 
eval_step: 10 
lr: 0.001 
seed: 123

## cross-validation
cv: True                               
k_folds: 3  
order_file: configs/orders/order_WSI-Graph-100splits_3-max-hops-simplification.txt

## SGFormer settings
hidden_channels: 256 
use_graph: True 
graph_weight: 0.5 
gnn_num_layers: 3 
gnn_dropout: 0.5 
gnn_weight_decay: 0.0 
gnn_use_residual: True 
gnn_use_weight: True 
gnn_use_bn: True 
gnn_use_act: True 
trans_num_layers: 1 
trans_dropout: 0.5 
trans_weight_decay: 0.0 
trans_use_residual: True 
trans_use_weight: True 
trans_use_bn: True 

## Device
device: 0