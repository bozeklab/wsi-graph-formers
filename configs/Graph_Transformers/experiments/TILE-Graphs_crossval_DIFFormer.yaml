# @package _global_  
dataset: subgraphs-skinwsi   # name of TILE-Graphs in the code
method: difformerbin   

### IMPORTANT for wsipatch dataset 
data_dir: toprovide_incmd
patient_csv: toprovide_incmd

trainingtask: binnodeclass_mask 
save_model: True 
metric: bacc 

## Node Features
zscore_normalization: True   
celltype_asfeature: True  

## Training setting
epochs: 200 
eval_step: 10 
lr: 0.001
seed: 123
weight_decay: 0.01
dropout: 0.2

## cross-validation
cv: True                                
k_folds: 3  

## DifFormer settings
hidden_channels: 64 
num_layers: 8 
num_heads: 1   
use_graph: True  
use_bn : True  
use_residual: True
alpha: 0.5  

## Device
device: 0

# EXPERIMENT configs
# see file name

